<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4A5544"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B8860B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="420" fill="#F7F8F4"/>

  <text x="400" y="40" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#1F2A1B">模块定路径，标签筛文件，包定可见性</text>
  <text x="400" y="64" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4A5544">左：跨包调用先过大小写这道线　右：从源码到二进制要过三道关卡</text>

  <line x1="400" y1="88" x2="400" y2="392" stroke="#C9CFBE" stroke-width="1" stroke-dasharray="5,5"/>

  <text x="200" y="100" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#1F2A1B">包：可见性边界</text>

  <rect x="50" y="130" width="140" height="64" rx="6" fill="#E7EADF" stroke="#7A846F" stroke-width="1.5"/>
  <text x="120" y="156" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#1F2A1B">main.go</text>
  <text x="120" y="178" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A5544">package main</text>

  <line x1="192" y1="162" x2="228" y2="162" stroke="#4A5544" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="210" y="152" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4A5544">import</text>

  <line x1="228" y1="108" x2="228" y2="212" stroke="#B8860B" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="228" y="100" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#B8860B">可见性边界</text>

  <rect x="240" y="118" width="160" height="108" rx="6" fill="#FFFDF7" stroke="#7A846F" stroke-width="1.5"/>
  <text x="320" y="140" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1F2A1B">printer 包</text>

  <rect x="254" y="152" width="132" height="30" rx="4" fill="#EAF0E4" stroke="#6B7F5B" stroke-width="1.2"/>
  <text x="320" y="172" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1F2A1B">Print（导出 ✓）</text>

  <rect x="254" y="188" width="132" height="30" rx="4" fill="#F0E6C8" stroke="#B8860B" stroke-width="1.2"/>
  <text x="320" y="208" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1F2A1B">decorate（未导出 ✗）</text>

  <text x="210" y="252" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#1F2A1B">首字母大写 → 跨包可见</text>
  <text x="210" y="276" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A5544">小写 → 只在包内，跨包调用编译失败</text>
  <text x="210" y="304" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A5544">一个目录一个包：身份来自 package 声明</text>
  <text x="210" y="328" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A5544">internal/ 下的包仅模块内可见</text>

  <text x="600" y="100" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#1F2A1B">构建：三道关卡</text>

  <rect x="450" y="120" width="300" height="56" rx="6" fill="#E7EADF" stroke="#7A846F" stroke-width="1.5"/>
  <text x="600" y="144" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1F2A1B">go.mod / go.sum</text>
  <text x="600" y="164" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#4A5544">模块路径定 import 前缀，require 定依赖版本</text>

  <line x1="600" y1="178" x2="600" y2="196" stroke="#4A5544" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="450" y="198" width="300" height="56" rx="6" fill="#F0E6C8" stroke="#B8860B" stroke-width="1.5"/>
  <text x="600" y="222" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1F2A1B">//go:build 与文件后缀</text>
  <text x="600" y="242" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#4A5544">编译前筛掉不匹配的文件，没选中的不存在</text>

  <line x1="600" y1="256" x2="600" y2="274" stroke="#4A5544" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="450" y="276" width="300" height="56" rx="6" fill="#EAF0E4" stroke="#6B7F5B" stroke-width="1.5"/>
  <text x="600" y="300" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1F2A1B">按包编译 → 二进制</text>
  <text x="600" y="320" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#4A5544">go:embed 的文件随产物一起交付</text>

  <text x="600" y="356" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#1F2A1B">go list -f '{{.GoFiles}}' 核对文件集合</text>
  <text x="600" y="380" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A5544">标签在编译前生效，不是运行时开关</text>
</svg>
