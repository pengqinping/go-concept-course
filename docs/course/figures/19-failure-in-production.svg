<svg xmlns="http://www.w3.org/2000/svg" width="800" height="410" viewBox="0 0 800 410" role="img" aria-labelledby="t d">
  <title id="t">一次请求的失败边界链</title>
  <desc id="d">超时、重试、幂等、优雅停机、可观测五道边界依次相连，构成一次外部调用的可靠性链条。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="800" height="410" fill="#F7F8F4"/>
  <g font-family="PingFang SC,Microsoft YaHei,sans-serif">
    <text x="40" y="46" font-size="23" font-weight="700" fill="#1f2937">可靠性是一条边界链，不是一层框架</text>
    <text x="40" y="74" font-size="14" fill="#475569">每一环回答一个具体问题；跳过中间一环，后面那环补不上前面的洞。</text>

    <g stroke-width="2">
      <rect x="32" y="120" width="128" height="92" rx="12" fill="#eef2ff" stroke="#6366f1"/>
      <rect x="188" y="120" width="128" height="92" rx="12" fill="#eef2ff" stroke="#6366f1"/>
      <rect x="344" y="120" width="128" height="92" rx="12" fill="#dcfce7" stroke="#15803d"/>
      <rect x="500" y="120" width="128" height="92" rx="12" fill="#eef2ff" stroke="#6366f1"/>
      <rect x="656" y="120" width="128" height="92" rx="12" fill="#eef2ff" stroke="#6366f1"/>
    </g>

    <g stroke-width="1.5">
      <circle cx="52" cy="142" r="11" fill="#ffffff" stroke="#6366f1"/>
      <circle cx="208" cy="142" r="11" fill="#ffffff" stroke="#6366f1"/>
      <circle cx="364" cy="142" r="11" fill="#ffffff" stroke="#15803d"/>
      <circle cx="520" cy="142" r="11" fill="#ffffff" stroke="#6366f1"/>
      <circle cx="676" cy="142" r="11" fill="#ffffff" stroke="#6366f1"/>
    </g>
    <g text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">
      <text x="52" y="147">1</text><text x="208" y="147">2</text><text x="364" y="147">3</text>
      <text x="520" y="147">4</text><text x="676" y="147">5</text>
    </g>

    <g text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">
      <text x="96" y="172">超时</text>
      <text x="252" y="172">重试</text>
      <text x="408" y="172">幂等</text>
      <text x="564" y="172">优雅停机</text>
      <text x="720" y="172">可观测</text>
    </g>
    <g text-anchor="middle" font-size="11.5" fill="#475569">
      <text x="96" y="194">这次等多久？</text>
      <text x="252" y="194">哪些错误值得再来？</text>
      <text x="408" y="194">重复算一次吗？</text>
      <text x="564" y="194">在途工作怎么办？</text>
      <text x="720" y="194">留下什么证据？</text>
    </g>

    <g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
      <line x1="160" y1="166" x2="186" y2="166"/>
      <line x1="316" y1="166" x2="342" y2="166"/>
      <line x1="472" y1="166" x2="498" y2="166"/>
      <line x1="628" y1="166" x2="654" y2="166"/>
    </g>

    <g text-anchor="middle" font-size="11.5" fill="#64748b">
      <text x="96" y="236">单次尝试上限</text>
      <text x="252" y="236">先分类再重试</text>
      <text x="408" y="236">同一键只算一次</text>
      <text x="564" y="236">通知后等收尾</text>
      <text x="720" y="236">留下可核对数字</text>
    </g>

    <rect x="40" y="266" width="720" height="106" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="62" y="294" font-size="14" font-weight="700" fill="#1f2937">一笔请求走过这条链</text>
    <text x="62" y="322" font-size="13" fill="#334155">尝试 #1 失败 → 尝试 #2 失败 → 尝试 #3 成功（同一幂等键，业务只发生一次）</text>
    <text x="62" y="350" font-size="13" fill="#334155">收到停机通知 → 等在途收尾 → 日志留下：下游调用 3 次 / 成功 1 次 / 重试 2 次</text>

    <text x="40" y="396" font-size="12" fill="#64748b">颜色只标两类：蓝色为机制节点，绿色为安全闸（幂等）。</text>
  </g>
</svg>
