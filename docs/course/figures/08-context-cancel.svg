<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#374151"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2E7D4F"/>
    </marker>
  </defs>

  <rect width="800" height="540" fill="#F7F8F4"/>

  <text x="28" y="36" font-size="18" font-weight="700" fill="#1F2933">取消是通知：父关 Done → 子级联 → worker 自己退出</text>
  <text x="28" y="60" font-size="12" fill="#4B5563">cancel() 不终止 goroutine，它只做一件事：关闭 Done 通道</text>

  <!-- 触发源 -->
  <rect x="40" y="88" width="150" height="46" rx="6" fill="#F6E2E0" stroke="#B23B36"/>
  <text x="115" y="108" font-size="13" font-weight="700" fill="#1F2933" text-anchor="middle">手动 cancel()</text>
  <text x="115" y="126" font-size="10" fill="#9B3B36" text-anchor="middle">上游决定不再要结果</text>

  <rect x="610" y="88" width="150" height="46" rx="6" fill="#EDE7F4" stroke="#74549A"/>
  <text x="685" y="108" font-size="13" font-weight="700" fill="#1F2933" text-anchor="middle">定时器到点</text>
  <text x="685" y="126" font-size="10" fill="#74549A" text-anchor="middle">WithTimeout 自动 cancel</text>

  <line x1="192" y1="111" x2="294" y2="111" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="608" y1="111" x2="506" y2="111" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 父 ctx -->
  <rect x="300" y="84" width="200" height="56" rx="8" fill="#E2EAF4" stroke="#3F6090" stroke-width="1.5"/>
  <text x="400" y="108" font-size="14" font-weight="700" fill="#1F2933" text-anchor="middle">parent ctx</text>
  <text x="400" y="128" font-size="11" fill="#374151" text-anchor="middle">close(Done) → Err() = Canceled</text>

  <!-- 级联到子 ctx -->
  <line x1="350" y1="140" x2="210" y2="198" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="140" x2="590" y2="198" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="174" font-size="11" fill="#4B5563" text-anchor="middle">父取消 → 所有子 Done 级联关闭（不反向传播）</text>

  <rect x="110" y="204" width="200" height="56" rx="8" fill="#E8EFF7" stroke="#3F6090"/>
  <text x="210" y="228" font-size="13" font-weight="700" fill="#1F2933" text-anchor="middle">child ctx A（WithCancel）</text>
  <text x="210" y="248" font-size="11" fill="#374151" text-anchor="middle">Done 也随之关闭</text>

  <rect x="490" y="204" width="200" height="56" rx="8" fill="#E8EFF7" stroke="#3F6090"/>
  <text x="590" y="228" font-size="13" font-weight="700" fill="#1F2933" text-anchor="middle">child ctx B（WithTimeout）</text>
  <text x="590" y="248" font-size="11" fill="#374151" text-anchor="middle">Done 也随之关闭</text>

  <!-- worker 的 select -->
  <line x1="210" y1="260" x2="210" y2="306" stroke="#2E7D4F" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="590" y1="260" x2="590" y2="306" stroke="#2E7D4F" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="90" y="310" width="240" height="80" rx="6" fill="#E6F0E6" stroke="#4C7A4C"/>
  <text x="102" y="332" font-size="12" fill="#1F2933">worker A：select {</text>
  <text x="102" y="352" font-size="12" fill="#1F2933">  case &lt;-ctx.Done():</text>
  <text x="102" y="372" font-size="12" fill="#1F2933">    return ctx.Err()</text>

  <rect x="470" y="310" width="240" height="80" rx="6" fill="#E6F0E6" stroke="#4C7A4C"/>
  <text x="482" y="332" font-size="12" fill="#1F2933">worker B：select {</text>
  <text x="482" y="352" font-size="12" fill="#1F2933">  case &lt;-ctx.Done():</text>
  <text x="482" y="372" font-size="12" fill="#1F2933">    return ctx.Err()</text>

  <!-- 退出结果 -->
  <line x1="210" y1="390" x2="210" y2="412" stroke="#2E7D4F" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="590" y1="390" x2="590" y2="412" stroke="#2E7D4F" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="90" y="416" width="240" height="42" rx="6" fill="#EEF2EA" stroke="#7A9B62"/>
  <text x="210" y="443" font-size="12" font-weight="700" fill="#1F2933" text-anchor="middle">退出原因：context canceled</text>

  <rect x="470" y="416" width="240" height="42" rx="6" fill="#EEF2EA" stroke="#7A9B62"/>
  <text x="590" y="443" font-size="12" font-weight="700" fill="#1F2933" text-anchor="middle">退出原因：context deadline exceeded</text>

  <text x="28" y="490" font-size="12" fill="#374151">Done 关闭 ≠ 任务已停：worker 必须在 select / 检查点主动 return，纯计算循环不会自己停</text>
  <text x="28" y="518" font-size="11" fill="#4B5563">数据与 Done 同时就绪时 select 随机选择：要求“取消后不处理新任务”，就在使用数据前再查 Err()</text>
</svg>
