<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#374151"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#B23B36"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2E7D4F"/>
    </marker>
  </defs>

  <rect width="800" height="470" fill="#F7F8F4"/>

  <!-- 上半：fan-out / fan-in -->
  <text x="28" y="36" font-size="18" font-weight="700" fill="#1F2933">① fan-out / fan-in：N 个 worker，一个汇聚点</text>
  <text x="28" y="58" font-size="12" fill="#4B5563">启动只是第一步；汇合（WaitGroup）与接力（channel）要一起设计</text>

  <rect x="28" y="88" width="118" height="48" rx="8" fill="#E2EAF4" stroke="#3F6090" stroke-width="1.5"/>
  <text x="87" y="108" font-size="13" font-weight="700" fill="#1F2933" text-anchor="middle">主 goroutine</text>
  <text x="87" y="126" font-size="10" fill="#374151" text-anchor="middle">发任务、收汇总</text>

  <line x1="146" y1="112" x2="182" y2="112" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="188" y="88" width="130" height="48" rx="8" fill="#E9F4EC" stroke="#2E7D4F" stroke-width="1.5"/>
  <text x="253" y="108" font-size="13" font-weight="700" fill="#1F2933" text-anchor="middle">jobs 任务 channel</text>
  <text x="253" y="126" font-size="10" fill="#2E7D4F" text-anchor="middle">close(jobs) 表示发完</text>

  <!-- 分发到 3 个 worker -->
  <line x1="318" y1="103" x2="352" y2="92" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="318" y1="112" x2="352" y2="140" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="318" y1="121" x2="352" y2="188" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="358" y="72" width="168" height="38" rx="6" fill="#E6F0E6" stroke="#4C7A4C"/>
  <text x="442" y="90" font-size="12" fill="#1F2933" text-anchor="middle">Worker 0</text>
  <text x="442" y="104" font-size="10" fill="#4B5563" text-anchor="middle">results ← job*job</text>
  <rect x="358" y="121" width="168" height="38" rx="6" fill="#E6F0E6" stroke="#4C7A4C"/>
  <text x="442" y="139" font-size="12" fill="#1F2933" text-anchor="middle">Worker 1</text>
  <text x="442" y="153" font-size="10" fill="#4B5563" text-anchor="middle">results ← job*job</text>
  <rect x="358" y="170" width="168" height="38" rx="6" fill="#E6F0E6" stroke="#4C7A4C"/>
  <text x="442" y="188" font-size="12" fill="#1F2933" text-anchor="middle">Worker 2</text>
  <text x="442" y="202" font-size="10" fill="#4B5563" text-anchor="middle">results ← job*job</text>

  <!-- 汇聚到结果 channel -->
  <line x1="526" y1="91" x2="560" y2="112" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="526" y1="140" x2="560" y2="122" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="526" y1="189" x2="560" y2="132" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="566" y="94" width="140" height="56" rx="8" fill="#E9F4EC" stroke="#2E7D4F" stroke-width="1.5"/>
  <text x="636" y="115" font-size="13" font-weight="700" fill="#1F2933" text-anchor="middle">results 结果 channel</text>
  <text x="636" y="133" font-size="10" fill="#2E7D4F" text-anchor="middle">缓冲 = 结果总数</text>
  <text x="636" y="146" font-size="10" fill="#4B5563" text-anchor="middle">worker 发送不阻塞</text>

  <line x1="706" y1="122" x2="738" y2="122" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="742" y="98" width="30" height="48" rx="6" fill="#E2EAF4" stroke="#3F6090"/>
  <text x="757" y="126" font-size="11" font-weight="700" fill="#1F2933" text-anchor="middle">汇总</text>

  <!-- WaitGroup 汇合 -->
  <path d="M 442 208 L 442 246" stroke="#2E7D4F" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#arrowGreen)"/>
  <rect x="358" y="250" width="348" height="40" rx="6" fill="#EEF2EA" stroke="#7A9B62" stroke-dasharray="5 3"/>
  <text x="532" y="268" font-size="12" font-weight="700" fill="#1F2933" text-anchor="middle">wg.Wait() → close(results)</text>
  <text x="532" y="284" font-size="10" fill="#4B5563" text-anchor="middle">Done 写在发送之后：等齐人头的一方才有资格关闭</text>

  <text x="28" y="286" font-size="11" fill="#4B5563">汇合的完成依赖接力的畅通：一环阻塞且无人来解，整条编排停在那里</text>

  <line x1="28" y1="306" x2="772" y2="306" stroke="#D7DBD2" stroke-width="1"/>

  <!-- 下半：泄漏路径 -->
  <text x="28" y="332" font-size="18" font-weight="700" fill="#1F2933">② 泄漏路径：没人接收的发送</text>

  <rect x="28" y="352" width="152" height="48" rx="6" fill="#F6E2E0" stroke="#9B3B36"/>
  <text x="104" y="372" font-size="12" font-weight="700" fill="#1F2933" text-anchor="middle">发送方 goroutine</text>
  <text x="104" y="390" font-size="10" fill="#6B7280" text-anchor="middle">orphan &lt;- 99，卡住</text>

  <line x1="180" y1="376" x2="236" y2="376" stroke="#B23B36" stroke-width="2" marker-end="url(#arrowRed)"/>

  <rect x="242" y="352" width="110" height="48" rx="6" fill="#FDECEA" stroke="#B23B36" stroke-width="1.5"/>
  <text x="297" y="372" font-size="13" font-weight="700" fill="#1F2933" text-anchor="middle">orphan</text>
  <text x="297" y="390" font-size="10" fill="#9B3B36" text-anchor="middle">无人接收</text>

  <rect x="412" y="352" width="130" height="48" rx="6" fill="#F7F8F4" stroke="#8A94A0" stroke-dasharray="4 3"/>
  <text x="477" y="380" font-size="12" fill="#6B7280" text-anchor="middle">（没有接收方）</text>

  <text x="28" y="424" font-size="11" fill="#9B3B36">永远阻塞 → goroutine 不退出 → 栈与引用无法释放：泄漏不崩溃，只积累</text>

  <line x1="104" y1="400" x2="560" y2="430" stroke="#2E7D4F" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowGreen)"/>
  <rect x="566" y="410" width="206" height="44" rx="6" fill="#EEF2EA" stroke="#7A9B62" stroke-dasharray="5 3"/>
  <text x="669" y="428" font-size="12" font-weight="700" fill="#1F2933" text-anchor="middle">select + time.After</text>
  <text x="669" y="445" font-size="10" fill="#4B5563" text-anchor="middle">放弃：无人接收 → 出口</text>

  <text x="28" y="462" font-size="11" fill="#374151">启动任何 goroutine 前先问：它的每一步阻塞，谁负责解除？</text>
</svg>
