<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#374151"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#B23B36"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2E7D4F"/>
    </marker>
  </defs>

  <rect width="800" height="540" fill="#F7F8F4"/>

  <!-- 上半：G-M-P -->
  <text x="28" y="36" font-size="18" font-weight="700" fill="#1F2933">① G-M-P：G 排队，P 调度，M 执行</text>
  <text x="28" y="60" font-size="12" fill="#4B5563">go f() 只把 G 放进队列；真正跑代码的是绑定了 P 的 M</text>

  <text x="28" y="84" font-size="11" fill="#6B7280">可运行 / 等待队列</text>
  <rect x="28" y="92" width="104" height="32" rx="6" fill="#E6F0E6" stroke="#4C7A4C"/>
  <text x="80" y="113" font-size="12" fill="#1F2933" text-anchor="middle">G1 正在运行</text>
  <rect x="28" y="132" width="104" height="32" rx="6" fill="#E6F0E6" stroke="#4C7A4C"/>
  <text x="80" y="153" font-size="12" fill="#1F2933" text-anchor="middle">G2 可运行</text>
  <rect x="28" y="172" width="104" height="32" rx="6" fill="#EDEFF1" stroke="#8A94A0" stroke-dasharray="4 3"/>
  <text x="80" y="193" font-size="12" fill="#4B5563" text-anchor="middle">G3 channel 等待</text>

  <line x1="136" y1="148" x2="196" y2="148" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="202" y="112" width="120" height="72" rx="8" fill="#E2EAF4" stroke="#3F6090" stroke-width="1.5"/>
  <text x="262" y="141" font-size="14" font-weight="700" fill="#1F2933" text-anchor="middle">P（逻辑处理器）</text>
  <text x="262" y="163" font-size="11" fill="#374151" text-anchor="middle">本地队列 + 执行上下文</text>

  <line x1="322" y1="148" x2="382" y2="148" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="388" y="112" width="120" height="72" rx="8" fill="#F5E9D8" stroke="#96703C" stroke-width="1.5"/>
  <text x="448" y="141" font-size="14" font-weight="700" fill="#1F2933" text-anchor="middle">M（OS 线程）</text>
  <text x="448" y="163" font-size="11" fill="#374151" text-anchor="middle">绑定 P 才执行 G</text>

  <line x1="508" y1="148" x2="568" y2="148" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="574" y="112" width="196" height="72" rx="8" fill="#EDE7F4" stroke="#74549A" stroke-width="1.5"/>
  <text x="672" y="141" font-size="14" font-weight="700" fill="#1F2933" text-anchor="middle">CPU 核心</text>
  <text x="672" y="163" font-size="11" fill="#374151" text-anchor="middle">每个 P 同一时刻只跑一个 G</text>

  <text x="28" y="220" font-size="12" fill="#4B5563">G 在 channel / 锁上阻塞 → M 与 P 解绑，P 改跑另一个 G；阻塞的 G 不占 CPU</text>

  <line x1="28" y1="240" x2="772" y2="240" stroke="#D7DBD2" stroke-width="1"/>

  <!-- 下半：channel 阻塞点 -->
  <text x="28" y="270" font-size="18" font-weight="700" fill="#1F2933">② Channel 的阻塞点：先到的一方要等对方</text>
  <text x="28" y="292" font-size="12" fill="#4B5563">channel 不是管道；是否完成取决于对方就绪，或缓冲区有空位 / 有值</text>

  <!-- 无缓冲 -->
  <text x="28" y="322" font-size="14" font-weight="700" fill="#9B3B36">无缓冲 make(chan int)</text>
  <rect x="28" y="346" width="110" height="44" rx="6" fill="#F6E2E0" stroke="#9B3B36"/>
  <text x="83" y="365" font-size="12" fill="#1F2933" text-anchor="middle">G1: ch &lt;- 7</text>
  <text x="83" y="382" font-size="10" fill="#6B7280" text-anchor="middle">先执行，卡住</text>

  <line x1="140" y1="368" x2="203" y2="368" stroke="#B23B36" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="166" y1="358" x2="180" y2="378" stroke="#B23B36" stroke-width="2"/>
  <line x1="180" y1="358" x2="166" y2="378" stroke="#B23B36" stroke-width="2"/>
  <text x="170" y="396" font-size="10" fill="#9B3B36" text-anchor="middle">等接收方就绪</text>

  <rect x="210" y="346" width="105" height="44" rx="6" fill="#FDECEA" stroke="#B23B36" stroke-width="1.5"/>
  <text x="262" y="365" font-size="14" font-weight="700" fill="#1F2933" text-anchor="middle">ch</text>
  <text x="262" y="382" font-size="10" fill="#9B3B36" text-anchor="middle">0 格，无暂存</text>

  <rect x="28" y="410" width="110" height="40" rx="6" fill="#F6E2E0" stroke="#9B3B36" stroke-dasharray="4 3"/>
  <text x="83" y="435" font-size="12" fill="#4B5563" text-anchor="middle">G1: &lt;-ch</text>
  <text x="148" y="436" font-size="10" fill="#9B3B36">同一个 G 卡在上一行，到不了这里</text>

  <line x1="83" y1="390" x2="83" y2="460" stroke="#2E7D4F" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowGreen)"/>
  <rect x="28" y="466" width="348" height="38" rx="6" fill="#EEF2EA" stroke="#7A9B62" stroke-dasharray="5 3"/>
  <text x="202" y="490" font-size="11" fill="#1F2933" text-anchor="middle">select + time.After → 超时走另一条分支，退出而不死锁</text>

  <!-- 有缓冲 -->
  <text x="418" y="322" font-size="14" font-weight="700" fill="#2E7D4F">缓冲 1 make(chan int, 1)</text>
  <rect x="418" y="346" width="110" height="44" rx="6" fill="#E6F2E9" stroke="#2E7D4F"/>
  <text x="473" y="365" font-size="12" fill="#1F2933" text-anchor="middle">G1: ch &lt;- 7</text>
  <text x="473" y="382" font-size="10" fill="#6B7280" text-anchor="middle">先执行，直接完成</text>

  <line x1="530" y1="368" x2="593" y2="368" stroke="#2E7D4F" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="561" y="396" font-size="10" fill="#2E7D4F" text-anchor="middle">有空位 → 立即完成</text>

  <rect x="600" y="346" width="110" height="44" rx="6" fill="#E9F4EC" stroke="#2E7D4F" stroke-width="1.5"/>
  <text x="655" y="365" font-size="14" font-weight="700" fill="#1F2933" text-anchor="middle">ch</text>
  <text x="655" y="382" font-size="10" fill="#2E7D4F" text-anchor="middle">1 格：■</text>

  <rect x="418" y="410" width="110" height="40" rx="6" fill="#E6F2E9" stroke="#2E7D4F"/>
  <text x="473" y="435" font-size="12" fill="#1F2933" text-anchor="middle">G1: &lt;-ch</text>
  <line x1="530" y1="430" x2="593" y2="430" stroke="#2E7D4F" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="561" y="458" font-size="10" fill="#2E7D4F" text-anchor="middle">有值 → 立即完成</text>

  <text x="418" y="490" font-size="11" fill="#4B5563">格子满了以后，发送仍要等接收方腾位置：缓冲只是把阻塞点后移</text>

  <text x="28" y="526" font-size="11" fill="#374151">同步协议决定“谁先走”，调度器决定“谁在跑”——两件事不要混为一谈</text>
</svg>
