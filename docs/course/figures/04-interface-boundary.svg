<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4A5544"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B8860B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="460" fill="#F7F8F4"/>

  <text x="400" y="40" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#1F2A1B">接口由调用方定义，实现隐式满足</text>
  <text x="400" y="64" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4A5544">接口是一份最小能力清单；方法集合里包含这些能力，就自动进入这张清单</text>

  <line x1="410" y1="88" x2="410" y2="432" stroke="#C9CFBE" stroke-width="1" stroke-dasharray="5,5"/>

  <text x="205" y="98" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#1F2A1B">调用方写下需要的能力</text>

  <rect x="100" y="112" width="210" height="68" rx="6" fill="#EAF0E4" stroke="#6B7F5B" stroke-width="1.5"/>
  <text x="205" y="140" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#1F2A1B">Reader（调用方定义）</text>
  <text x="205" y="164" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A5544">Read(p []byte) (int, error)</text>

  <line x1="90" y1="248" x2="150" y2="182" stroke="#4A5544" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="205" y1="248" x2="205" y2="182" stroke="#4A5544" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="320" y1="248" x2="260" y2="182" stroke="#4A5544" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="205" y="230" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4A5544">方法集合含 Read → 满足</text>

  <rect x="40" y="250" width="100" height="56" rx="6" fill="#E7EADF" stroke="#7A846F" stroke-width="1.5"/>
  <text x="90" y="282" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#1F2A1B">strings.Reader</text>

  <rect x="155" y="250" width="100" height="56" rx="6" fill="#E7EADF" stroke="#7A846F" stroke-width="1.5"/>
  <text x="205" y="282" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#1F2A1B">bytes.Buffer</text>

  <rect x="270" y="250" width="100" height="56" rx="6" fill="#E7EADF" stroke="#7A846F" stroke-width="1.5"/>
  <text x="320" y="282" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#1F2A1B">自定义 Reader</text>

  <text x="205" y="338" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#1F2A1B">没有 implements 声明</text>
  <text x="205" y="364" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A5544">实现方可以在别的包，甚至不知道接口存在</text>

  <text x="605" y="98" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#1F2A1B">接口变量的剖面：一对信息</text>

  <rect x="440" y="112" width="330" height="150" rx="6" fill="#FFFDF7" stroke="#B8860B" stroke-width="1.5"/>
  <text x="605" y="138" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1F2A1B">boxed Reader（非 nil）</text>

  <rect x="456" y="156" width="138" height="80" rx="6" fill="#EAF0E4" stroke="#6B7F5B" stroke-width="1.5"/>
  <text x="525" y="186" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A5544">动态类型</text>
  <text x="525" y="214" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1F2A1B">*bytes.Buffer</text>

  <rect x="606" y="156" width="148" height="80" rx="6" fill="#E7EADF" stroke="#7A846F" stroke-width="1.5"/>
  <text x="680" y="186" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A5544">动态值</text>
  <text x="680" y="214" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1F2A1B">nil（空指针）</text>

  <text x="605" y="292" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#1F2A1B">boxed == nil → false：类型栏不为空</text>
  <text x="605" y="318" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A5544">nilBuf == nil → true：指针本身是 nil</text>
  <text x="605" y="344" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A5544">只做判定，不调用 Read —— 调用会 panic</text>

  <rect x="440" y="372" width="330" height="48" rx="6" fill="#FFFDF7" stroke="#B8860B" stroke-width="1.5"/>
  <text x="605" y="402" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#1F2A1B">nil 接口 = 类型空 + 值空；typed nil 只空了一半</text>
</svg>
