<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-label="一次请求穿过 Server、Mux、Handler 到响应的流水线，标出四类超时与资源责任">
  <defs>
    <marker id="arrDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b3a2b"/>
    </marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a6b3f"/>
    </marker>
  </defs>

  <rect width="800" height="470" fill="#F7F8F4"/>
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2421">一次请求穿过哪些边界：Server → Mux → Handler → 响应</text>
  <text x="400" y="56" text-anchor="middle" font-size="13" fill="#9a6b3f">橙色标签标出四类超时各自封住的位置</text>

  <!-- 主流水线 -->
  <rect x="40" y="86" width="140" height="70" rx="8" fill="#E8F0E4" stroke="#4a7a46" stroke-width="2"/>
  <text x="110" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2421">Server</text>
  <text x="110" y="136" text-anchor="middle" font-size="12" fill="#1f2421">连接与超时</text>

  <path d="M182 121 L 214 121" fill="none" stroke="#2b3a2b" stroke-width="2.5" marker-end="url(#arrDark)"/>

  <rect x="218" y="86" width="132" height="70" rx="8" fill="#E8F0E4" stroke="#4a7a46" stroke-width="2"/>
  <text x="284" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2421">ServeMux</text>
  <text x="284" y="136" text-anchor="middle" font-size="12" fill="#1f2421">方法与路径路由</text>

  <path d="M352 121 L 384 121" fill="none" stroke="#2b3a2b" stroke-width="2.5" marker-end="url(#arrDark)"/>

  <rect x="388" y="86" width="140" height="70" rx="8" fill="#E6EDF5" stroke="#4a6a9a" stroke-width="2"/>
  <text x="458" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2421">Handler</text>
  <text x="458" y="136" text-anchor="middle" font-size="12" fill="#1f2421">一次请求的处理</text>

  <path d="M530 121 L 562 121" fill="none" stroke="#2b3a2b" stroke-width="2.5" marker-end="url(#arrDark)"/>

  <rect x="566" y="86" width="194" height="70" rx="8" fill="#E8F0E4" stroke="#4a7a46" stroke-width="2"/>
  <text x="663" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2421">ResponseWriter</text>
  <text x="663" y="136" text-anchor="middle" font-size="12" fill="#1f2421">写状态与响应体</text>

  <!-- 四类超时标签 -->
  <line x1="90" y1="156" x2="90" y2="178" stroke="#9a6b3f" stroke-width="1.8" stroke-dasharray="4 3"/>
  <rect x="40" y="180" width="140" height="46" rx="6" fill="#F3E8DC" stroke="#9a6b3f"/>
  <text x="110" y="199" text-anchor="middle" font-size="11" fill="#1f2421">ReadHeaderTimeout</text>
  <text x="110" y="216" text-anchor="middle" font-size="11" fill="#9a6b3f">等完整请求头</text>

  <line x1="284" y1="156" x2="284" y2="178" stroke="#9a6b3f" stroke-width="1.8" stroke-dasharray="4 3"/>
  <rect x="208" y="180" width="152" height="46" rx="6" fill="#F3E8DC" stroke="#9a6b3f"/>
  <text x="284" y="199" text-anchor="middle" font-size="11" fill="#1f2421">ReadTimeout</text>
  <text x="284" y="216" text-anchor="middle" font-size="11" fill="#9a6b3f">读请求体太慢</text>

  <line x1="663" y1="156" x2="663" y2="178" stroke="#9a6b3f" stroke-width="1.8" stroke-dasharray="4 3"/>
  <rect x="566" y="180" width="194" height="46" rx="6" fill="#F3E8DC" stroke="#9a6b3f"/>
  <text x="663" y="199" text-anchor="middle" font-size="11" fill="#1f2421">WriteTimeout</text>
  <text x="663" y="216" text-anchor="middle" font-size="11" fill="#9a6b3f">写响应太慢（不管业务）</text>

  <rect x="388" y="180" width="140" height="46" rx="6" fill="#F3E8DC" stroke="#9a6b3f"/>
  <text x="458" y="199" text-anchor="middle" font-size="11" fill="#1f2421">IdleTimeout</text>
  <text x="458" y="216" text-anchor="middle" font-size="11" fill="#9a6b3f">空闲连接回收</text>

  <line x1="24" y1="244" x2="776" y2="244" stroke="#c9cfc4" stroke-width="1.5"/>

  <!-- 下半：路由分界与资源责任 -->
  <rect x="40" y="262" width="344" height="164" rx="8" fill="#F7F8F4" stroke="#4a7a46" stroke-width="2"/>
  <text x="212" y="288" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2421">Mux：方法也是路由的一部分</text>
  <text x="58" y="316" font-size="13" fill="#1f2421">GET /tasks/42　　路径与方法都命中 → 200</text>
  <text x="58" y="344" font-size="13" fill="#1f2421">DELETE /tasks/42　路径命中、方法不允许 → 405</text>
  <text x="58" y="372" font-size="13" fill="#1f2421">GET /unknown/404　没有任何模式命中 → 404</text>
  <text x="58" y="404" font-size="12" fill="#4a7a46">405 是路径存在、方法不对；404 才是路径不存在</text>

  <rect x="412" y="262" width="348" height="164" rx="8" fill="#F7F8F4" stroke="#4a6a9a" stroke-width="2"/>
  <text x="586" y="288" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2421">谁拥有资源，谁负责关闭</text>
  <text x="430" y="316" font-size="13" fill="#1f2421">Handler：defer r.Body.Close()</text>
  <text x="430" y="344" font-size="13" fill="#1f2421">Server：回收与复用连接</text>
  <text x="430" y="372" font-size="13" fill="#1f2421">业务卡住：靠 r.Context() 传播取消</text>
  <text x="430" y="404" font-size="12" fill="#4a6a9a">超时封的是 I/O，不是Handler 内部逻辑</text>

  <text x="400" y="452" text-anchor="middle" font-size="13" fill="#1f2421">分层的收益：把 Handler 单独交给 httptest，不发真实网络请求也能验证业务</text>
</svg>
