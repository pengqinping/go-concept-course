<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#374151"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2E7D4F"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#B23B36"/>
    </marker>
  </defs>

  <rect width="800" height="450" fill="#F7F8F4"/>

  <!-- 上半：管道剖面 -->
  <text x="28" y="36" font-size="18" font-weight="700" fill="#1F2933">① 管道剖面：字节从源到汇，每层只做一件事</text>
  <text x="28" y="58" font-size="12" fill="#4B5563">包装改变"经过时发生什么"，不改变字节本身；每一层只有一个职责</text>

  <rect x="28" y="86" width="136" height="64" rx="8" fill="#E2EAF4" stroke="#3F6090" stroke-width="1.5"/>
  <text x="96" y="112" font-size="13" font-weight="700" fill="#1F2933" text-anchor="middle">strings.Reader</text>
  <text x="96" y="132" font-size="10" fill="#374151" text-anchor="middle">源：字节从这里出发</text>

  <line x1="164" y1="118" x2="196" y2="118" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="202" y="86" width="146" height="64" rx="8" fill="#E6F0E6" stroke="#4C7A4C" stroke-width="1.5"/>
  <text x="275" y="112" font-size="13" font-weight="700" fill="#1F2933" text-anchor="middle">计数 Reader</text>
  <text x="275" y="132" font-size="10" fill="#4B5563" text-anchor="middle">记账，不改字节</text>
  <text x="275" y="144" font-size="10" fill="#4B5563" text-anchor="middle">每次最多 readChunk 字节</text>

  <line x1="348" y1="118" x2="380" y2="118" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="386" y="86" width="140" height="64" rx="8" fill="#E6F0E6" stroke="#4C7A4C" stroke-width="1.5"/>
  <text x="456" y="112" font-size="13" font-weight="700" fill="#1F2933" text-anchor="middle">io.TeeReader</text>
  <text x="456" y="132" font-size="10" fill="#4B5563" text-anchor="middle">一份数据，两个去向</text>
  <text x="456" y="144" font-size="10" fill="#4B5563" text-anchor="middle">主流照走，副本抄送</text>

  <line x1="526" y1="118" x2="558" y2="118" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="564" y="86" width="120" height="64" rx="8" fill="#EDE7F4" stroke="#74549A" stroke-width="1.5"/>
  <text x="624" y="112" font-size="13" font-weight="700" fill="#1F2933" text-anchor="middle">io.Copy</text>
  <text x="624" y="132" font-size="10" fill="#4B5563" text-anchor="middle">读一块写一块</text>
  <text x="624" y="144" font-size="10" fill="#4B5563" text-anchor="middle">循环到 EOF 为止</text>

  <line x1="684" y1="118" x2="712" y2="118" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="718" y="86" width="56" height="64" rx="8" fill="#E9F4EC" stroke="#2E7D4F" stroke-width="1.5"/>
  <text x="746" y="114" font-size="11" font-weight="700" fill="#1F2933" text-anchor="middle">bytes.</text>
  <text x="746" y="128" font-size="11" font-weight="700" fill="#1F2933" text-anchor="middle">Buffer</text>
  <text x="746" y="144" font-size="10" fill="#4B5563" text-anchor="middle">汇聚</text>

  <!-- Tee 分流副本 -->
  <line x1="456" y1="150" x2="456" y2="186" stroke="#2E7D4F" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowGreen)"/>
  <rect x="386" y="190" width="140" height="38" rx="6" fill="#EEF2EA" stroke="#7A9B62" stroke-dasharray="5 3"/>
  <text x="456" y="208" font-size="12" fill="#1F2933" text-anchor="middle">side 副本</text>
  <text x="456" y="222" font-size="10" fill="#4B5563" text-anchor="middle">与主流内容一致</text>

  <text x="28" y="254" font-size="11" fill="#4B5563">顺序决定行为：计数层包在外层看到 Copy 索要的节奏，包在内层看到攒批后的大块——数据一样，经过方式不一样</text>

  <line x1="28" y1="272" x2="772" y2="272" stroke="#D7DBD2" stroke-width="1"/>

  <!-- 下半：Close 责任 -->
  <text x="28" y="298" font-size="18" font-weight="700" fill="#1F2933">② Close 的责任：谁打开谁负责</text>

  <rect x="28" y="318" width="190" height="56" rx="8" fill="#E9F4EC" stroke="#2E7D4F" stroke-width="1.5"/>
  <text x="123" y="340" font-size="13" font-weight="700" fill="#1F2933" text-anchor="middle">打开者</text>
  <text x="123" y="360" font-size="10" fill="#2E7D4F" text-anchor="middle">defer Close() 写在这里</text>

  <line x1="218" y1="346" x2="254" y2="346" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="260" y="318" width="230" height="56" rx="8" fill="#E2EAF4" stroke="#3F6090" stroke-width="1.5"/>
  <text x="375" y="340" font-size="13" font-weight="700" fill="#1F2933" text-anchor="middle">借用方：包装层 / io.Copy</text>
  <text x="375" y="360" font-size="10" fill="#374151" text-anchor="middle">只用，不关闭</text>

  <line x1="490" y1="346" x2="526" y2="346" stroke="#B23B36" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowRed)"/>
  <text x="508" y="336" font-size="10" fill="#9B3B36" text-anchor="middle">责任不随字节下传</text>

  <rect x="532" y="318" width="240" height="56" rx="8" fill="#FDECEA" stroke="#B23B36" stroke-width="1.5"/>
  <text x="652" y="340" font-size="12" font-weight="700" fill="#1F2933" text-anchor="middle">TeeReader / LimitReader 不会关底层</text>
  <text x="652" y="360" font-size="10" fill="#9B3B36" text-anchor="middle">所有权转移必须显式交接，别两边都关或都不关</text>

  <text x="28" y="414" font-size="11" fill="#374151">包装可以无限叠加，Close 不会跟着叠：它始终停在打开资源的那一行</text>
  <text x="28" y="436" font-size="11" fill="#4B5563">组合叠加能力，责任必须有人认领</text>
</svg>
