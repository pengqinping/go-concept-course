<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4A5544"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B8860B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="460" fill="#F7F8F4"/>

  <text x="400" y="40" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#1F2A1B">返回路径上的 defer 栈，与 panic 展开中的 recover 拦截点</text>
  <text x="400" y="64" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4A5544">左：正常返回，defer 按 ③②① 弹出，可改写命名返回值　右：panic 沿栈展开，defer 逐层执行，recover 就地拦截</text>

  <line x1="400" y1="88" x2="400" y2="428" stroke="#C9CFBE" stroke-width="1" stroke-dasharray="5,5"/>

  <text x="200" y="104" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#1F2A1B">正常返回：defer LIFO</text>

  <rect x="90" y="122" width="220" height="40" rx="6" fill="#E7EADF" stroke="#7A846F" stroke-width="1.5"/>
  <text x="200" y="148" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1F2A1B">defer A（先注册）</text>

  <rect x="90" y="170" width="220" height="40" rx="6" fill="#E7EADF" stroke="#7A846F" stroke-width="1.5"/>
  <text x="200" y="196" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1F2A1B">defer B</text>

  <rect x="90" y="218" width="220" height="40" rx="6" fill="#E7EADF" stroke="#7A846F" stroke-width="1.5"/>
  <text x="200" y="244" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1F2A1B">defer C（后注册）</text>

  <line x1="118" y1="266" x2="118" y2="300" stroke="#4A5544" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="118" y="292" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4A5544">返回</text>

  <text x="200" y="292" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#B8860B">弹出顺序：C → B → A</text>

  <rect x="90" y="314" width="220" height="46" rx="6" fill="#FFFDF7" stroke="#B8860B" stroke-width="1.5"/>
  <text x="200" y="334" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#1F2A1B">return x：先写入返回值</text>
  <text x="200" y="352" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A5544">命名返回值可被 defer 再改写</text>

  <text x="200" y="392" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A5544">参数在 defer 语句处求值：</text>
  <text x="200" y="414" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A5544">defer f(i) 冻结副本，闭包执行时才读</text>

  <text x="600" y="104" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#1F2A1B">panic：沿调用栈展开</text>

  <rect x="440" y="122" width="160" height="40" rx="6" fill="#E7EADF" stroke="#7A846F" stroke-width="1.5"/>
  <text x="520" y="148" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1F2A1B">main</text>

  <line x1="600" y1="142" x2="640" y2="142" stroke="#4A5544" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="620" y="132" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4A5544">调用</text>

  <rect x="642" y="122" width="140" height="40" rx="6" fill="#E7EADF" stroke="#7A846F" stroke-width="1.5"/>
  <text x="712" y="148" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1F2A1B">f</text>

  <line x1="712" y1="164" x2="712" y2="196" stroke="#4A5544" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="726" y="184" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4A5544">调用</text>

  <rect x="642" y="198" width="140" height="40" rx="6" fill="#F0E6C8" stroke="#B8860B" stroke-width="1.5"/>
  <text x="712" y="217" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1F2A1B">g：panic！</text>
  <text x="712" y="232" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4A5544">正常控制流停止</text>

  <line x1="636" y1="218" x2="596" y2="218" stroke="#B8860B" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrowGold)"/>
  <line x1="520" y1="238" x2="520" y2="272" stroke="#B8860B" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="490" y="262" text-anchor="end" font-family="sans-serif" font-size="11" fill="#B8860B">向上展开</text>

  <rect x="440" y="274" width="160" height="52" rx="6" fill="#EAF0E4" stroke="#6B7F5B" stroke-width="1.8"/>
  <text x="520" y="296" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#1F2A1B">拦截点：defer 里 recover()</text>
  <text x="520" y="314" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4A5544">拿到非 nil → 展开停止</text>

  <line x1="440" y1="300" x2="400" y2="300" stroke="#4A5544" stroke-width="1.4" marker-end="url(#arrow)" stroke-dasharray="4,3"/>
  <text x="520" y="348" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1F2A1B" font-weight="600">g 带着改过的命名返回值正常返回，main 继续</text>

  <text x="600" y="386" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A5544">没接住 → 继续展开到栈底，进程退出</text>
  <text x="600" y="410" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A5544">panic 点之后的代码永远不执行</text>
  <text x="600" y="434" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A5544">recover 只作用于当前 goroutine</text>
</svg>
